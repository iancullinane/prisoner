name: Build and Push to ECR

on:
  push:
    branches: [icullinane/version2]   # publish :sha + :latest on merge
    tags: ['v*']                       # publish :version + :latest on release
  workflow_dispatch:                   # manual re-publish

# One publish per ref; cancel a superseded build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: prisoner

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-sqlc   # see Option 2
      - run: go build ./...
      - run: go test ./...


  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - name: Generate sqlc
        run: sqlc generate

      - name: Integration test
        run: make test-integration


  # Cheap gate: did any NON-frontend source change? Lets us skip the heavy image
  # build on web-only merges. Tag / dispatch runs bypass it via `if:`.
  # (No base ref on a tag push → paths-filter marks everything changed & succeeds.)
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read         # checkout + paths-filter read the repo
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # On PUSH events paths-filter diffs with local git, so the repo must be
      # checked out — without this it errors "fatal: not a git repository".
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - '**'          # anything…
              - '!web/**'      # …except the frontend

  build-and-push:
    name: Build and Push Docker Image
    needs: changes
    # build when non-web source changed, OR it's a release tag, OR a manual run
    if: >-
      needs.changes.outputs.backend == 'true' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          # Generate tags based on git ref
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "tags=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${VERSION},${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "tags=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${SHORT_SHA},${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT
          fi

      # registers QEMU emulators so the x86 runner can execute arm64 steps
      # (needed for the `apk add` in the arm64 runtime stage)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # sets up the buildx builder that can produce multi-arch manifest lists
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # builds both arches and pushes the manifest list under all tags in one step
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

      - name: Image digest
        run: |
          echo "Image pushed successfully!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
