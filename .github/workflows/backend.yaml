name: Build and push backend

on:
  push:
    # Every branch publishes :sha. Only the default branch also moves :latest
    # (see the "Extract metadata" step). Note `branches` and `tags` are a union
    # — once `branches` is set, tag pushes need their own key to fire at all.
    branches: ['**']
    tags: ['v*']                       # publish :version + :latest on release
  workflow_dispatch:                   # manual re-publish

# One publish per ref; cancel a superseded build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: prisoner

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-sqlc
      - run: go build ./...
      - run: go test ./...


  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-sqlc
      - name: Integration test
        run: make test-integration


  # Cheap gate: did any NON-frontend source change? Lets us skip the heavy image
  # build on web-only merges. Tag / dispatch runs bypass it via `if:`.
  # (No base ref on a tag push → paths-filter marks everything changed & succeeds.)
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read         # checkout + paths-filter read the repo
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # On PUSH events paths-filter diffs with local git, so the repo must be
      # checked out — without this it errors "fatal: not a git repository".
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - '**'          # anything…
              - '!web/**'      # …except the frontend

  build-and-push:
    name: Build and Push Docker Image
    needs: [build-and-test, integration-test, changes]
    # build when non-web source changed, OR it's a release tag, OR a manual run
    if: >-
      needs.changes.outputs.backend == 'true' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Every push gets an immutable :<short-sha>. On a feature branch this
          # is the only tag produced — nothing there should move :latest.
          TAGS="$IMAGE:$SHORT_SHA"

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Release tag → also publish :<version> and move :latest
            TAGS="$TAGS,$IMAGE:${GITHUB_REF#refs/tags/},$IMAGE:latest"
          elif [[ $GITHUB_REF == refs/heads/icullinane/version2 ]]; then
            # Default branch → move :latest. Plain string compare, so the slash
            # in the branch name needs no escaping.
            TAGS="$TAGS,$IMAGE:latest"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # registers QEMU emulators so the x86 runner can execute arm64 steps
      # (needed for the `apk add` in the arm64 runtime stage)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # sets up the buildx builder that can produce multi-arch manifest lists
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # builds both arches and pushes the manifest list under all tags in one step
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

      - name: Image digest
        run: |
          echo "Image pushed successfully!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
