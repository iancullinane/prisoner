name: Build and Test

on:
  push:
    branches: [icullinane/version2]   # CI on merge to the default branch
  pull_request:                        # CI on PRs (feature branches)

# Cancel an in-progress run when a newer commit lands on the same ref, so
# rapid pushes don't stack up redundant CI jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-sqlc   # see Option 2
      - run: go build ./...
      - run: go test ./...


  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - name: Generate sqlc
        run: sqlc generate

      - name: Integration test
        run: make test-integration
